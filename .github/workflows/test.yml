name: Generate Daily Weather Report

on:
  workflow_dispatch: # Keeps the manual run button
  schedule:
    - cron: '0 11 * * *' # Runs automatically every day at 11:00 AM UTC (6:00 AM EST - Winter/Standard Time)
    - cron: '0 10 * * *' # Runs automatically every day at 10:00 AM UTC (6:00 AM EDT - Summer/Daylight Saving Time)

jobs:
  build-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gives permission to save the HTML file back to the repo
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests

      - name: Run weather script
        run: python3 Weather_Report.py

      - name: Commit and push updated report
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add Weather_Report.html
          git commit -m "Auto-update weather report [skip ci]" || echo "No changes to commit"
          git push

